<script>
  (function() {
    const toast = document.getElementById('toast-feedback');
    const toastMsg = document.getElementById('toast-message');
    let toastTimeout;

    function showToast(message) {
      if (!toast) return;
      toastMsg.textContent = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2000);
    }

    const cardAddBtn = document.getElementById('add-schedule-card-btn');
    const fabBtn = document.getElementById('fab-add-schedule');

    if (cardAddBtn) {
      cardAddBtn.addEventListener('click', () => {
        showToast('새 일정 작성 창으로 이동합니다.');
      });
    }

    if (fabBtn) {
      fabBtn.addEventListener('click', () => {
        showToast('새 일정 작성을 시작합니다.');
      });
    }

    const chips = document.querySelectorAll('.quick-template-chip');
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        const titleSpan = chip.querySelector('span.truncate');
        const text = titleSpan ? titleSpan.textContent.trim() : '일정';
        showToast(`'${text}' 일정이 추가되었습니다.`);
      });
    });
  })();
